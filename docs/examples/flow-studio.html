<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Flow Studio — Workflow Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before first paint to avoid flash of incorrect theme
  (function () {
    try {
      var saved = localStorage.getItem('flow-studio:theme');
      var theme = (saved === 'dark' || saved === 'light') ? saved
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (_) {}
  })();
</script>
<style>
  /* =============================================================
     THEME PALETTES — WCAG AA contrast targets
     Normal text ≥4.5:1, large text ≥3:1. text-3 reserved for hints/decoration.
     ============================================================= */
  :root,
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-0: #07080b;   /* canvas */
    --bg-1: #11141b;   /* panels — lifted so shadows register against bg-0 */
    --bg-2: #171b24;
    --bg-3: #1f2430;
    --bg-4: #2a3040;
    --stroke-0: rgba(255,255,255,0.06);
    --stroke-1: rgba(255,255,255,0.12);
    --stroke-2: rgba(255,255,255,0.22);
    --stroke-3: rgba(255,255,255,0.36);
    --text-0: #f5f6f8;  /* ~17:1 on bg-1 */
    --text-1: #d6dae3;  /* ~13:1 */
    --text-2: #a0a6b2;  /* ~6.6:1 (AA) */
    --text-3: #6c7280;  /* ~3.6:1 (large text / hints) */
    --accent: #e5b36a;         /* ~8.7:1 on bg-0 */
    --accent-dim: #9a7a3f;
    --accent-btn-text: #1a1200;
    --run: #f4c56a;
    --ok: #7ddbaf;
    --err: #ff8888;
    --paused: #9cc0ff;
    --cancel: #c0c4cc;

    --n-start:    #c5d86d;
    --n-action:   #94b4f7;
    --n-if:       #f0a35e;
    --n-switch:   #e878b8;
    --n-loop:     #7fc7b8;
    --n-ai:       #c49bff;
    --n-subflow:  #ffd36e;
    --n-container:#9ba3b4;
    --n-end:      #ff9c95;

    --grid-dot: rgba(255,255,255,0.09);
    --canvas-bg: var(--bg-0);
    --panel-glass-tint: rgba(255,255,255,0.022);
    /* Dark-mode elevation: top-edge light catch + outer light ring + deep black drop */
    --node-shadow:
      0 1px 0 rgba(255,255,255,0.09) inset,
      0 0 0 1px rgba(255,255,255,0.05),
      0 3px 8px rgba(0,0,0,0.7),
      0 22px 42px -14px rgba(0,0,0,1);

    --shadow-panel:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 0 0 1px rgba(255,255,255,0.04),
      0 18px 48px -18px rgba(0,0,0,1);
    --glow-accent: 0 0 0 1px var(--stroke-2), 0 6px 24px -6px rgba(229,179,106,0.45);
    --focus-ring: 0 0 0 2px var(--bg-0), 0 0 0 4px var(--accent);
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg-0: #eef1f7;   /* off-white chrome background */
    --bg-1: #ffffff;   /* panels */
    --bg-2: #f4f6fa;
    --bg-3: #e4e8f0;
    --bg-4: #ccd3de;
    --stroke-0: rgba(15,20,30,0.06);
    --stroke-1: rgba(15,20,30,0.14);
    --stroke-2: rgba(15,20,30,0.26);
    --stroke-3: rgba(15,20,30,0.42);
    --text-0: #0b1018;  /* ~17:1 on white */
    --text-1: #1e293b;  /* ~13:1 */
    --text-2: #475569;  /* ~7.2:1 (AA) */
    --text-3: #64748b;  /* ~4.8:1 */
    --accent: #8a5a0f;         /* ~6.9:1 on white */
    --accent-dim: #6b4608;
    --accent-btn-text: #ffffff;
    --run: #9c6d0a;            /* 5.7:1 */
    --ok: #0f7a55;             /* 5.3:1 */
    --err: #b52d2d;            /* 6.3:1 */
    --paused: #234a9f;         /* 7:1 */
    --cancel: #475569;

    --n-start:    #4d7a08;
    --n-action:   #1f4bc5;
    --n-if:       #a04b10;
    --n-switch:   #8c2566;
    --n-loop:     #0e6c5e;
    --n-ai:       #5a32b0;
    --n-subflow:  #8a6200;
    --n-container:#374151;
    --n-end:      #9a2b2b;

    --grid-dot: rgba(15,20,30,0.12);
    --canvas-bg: #ffffff;   /* pure white canvas */
    --panel-glass-tint: rgba(15,20,30,0.02);

    --node-shadow:
      0 0 0 1px rgba(15,20,30,0.12),
      0 1px 2px rgba(15,20,30,0.06),
      0 10px 24px -12px rgba(15,20,30,0.28);
    --shadow-panel:
      0 0 0 1px rgba(15,20,30,0.08),
      0 12px 32px -20px rgba(15,20,30,0.3);
    --glow-accent: 0 0 0 1px var(--accent), 0 6px 18px -6px rgba(138,90,15,0.35);
    --focus-ring: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--accent);
  }

  /* ========== Keyboard accessibility ========== */
  *:focus { outline: none; }
  *:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
    border-radius: 6px;
    z-index: 10;
  }
  .tb-btn:focus-visible, button:focus-visible { box-shadow: var(--focus-ring); }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 3px rgba(138,90,15,0.25);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: 'Instrument Sans', -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; font-size: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; background: var(--bg-1); border: 1px solid var(--stroke-1); border-radius: 6px; padding: 6px 9px; font-size: 12px; outline: none; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--stroke-3); background: var(--bg-2); }
  textarea { resize: vertical; min-height: 60px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }

  /* ============ LAYOUT ============ */
  .app {
    display: grid;
    grid-template-columns: 248px 1fr 320px;
    grid-template-rows: 48px 1fr 180px;
    grid-template-areas:
      "topbar topbar topbar"
      "palette canvas inspector"
      "palette logs   inspector";
    height: 100vh;
    width: 100vw;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(212,166,87,0.04), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(148,180,247,0.03), transparent 50%),
      var(--bg-0);
  }

  /* ============ TOPBAR ============ */
  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 14px;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    border-bottom: 1px solid var(--stroke-1);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-right: 12px;
    border-right: 1px solid var(--stroke-1);
    height: 100%;
    padding-right: 16px;
  }
  .brand-mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: conic-gradient(from 45deg, var(--accent), #e7c891, var(--accent), var(--accent-dim), var(--accent));
    box-shadow: 0 0 16px -4px rgba(212,166,87,0.6), inset 0 0 0 1px rgba(255,255,255,0.15);
    position: relative;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 6px; background: var(--bg-0); border-radius: 2px;
  }
  .brand-name { font-weight: 600; letter-spacing: -0.01em; }
  .brand-meta { color: var(--text-3); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px; }

  .wf-title {
    display: flex; align-items: center; gap: 10px; padding: 0 4px;
  }
  .wf-title input {
    background: transparent; border: 1px solid transparent;
    padding: 4px 8px; font-size: 13px; font-weight: 500;
    width: 260px;
  }
  .wf-title input:hover { border-color: var(--stroke-1); }
  .wf-title input:focus { border-color: var(--stroke-2); background: var(--bg-1); }
  .wf-status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-3);
  }
  .wf-status-dot.dirty { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .wf-status-dot.saved { background: var(--ok); }

  .tb-group {
    display: flex; align-items: center; gap: 2px;
    padding: 3px;
    background: var(--bg-1);
    border: 1px solid var(--stroke-1);
    border-radius: 8px;
  }
  .tb-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    border-radius: 5px;
    color: var(--text-1);
    font-size: 12px;
    font-weight: 500;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .tb-btn:hover { background: var(--bg-3); color: var(--text-0); }
  .tb-btn:disabled { color: var(--text-3); cursor: not-allowed; }
  .tb-btn:disabled:hover { background: transparent; }
  .tb-btn svg { width: 13px; height: 13px; }
  .tb-btn.primary {
    background: linear-gradient(180deg, #e7c891, var(--accent));
    color: #2a1f08;
    font-weight: 600;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 0 16px -6px rgba(212,166,87,0.8);
  }
  .tb-btn.primary:hover { filter: brightness(1.05); }
  .tb-btn.danger { color: var(--err); }
  .tb-btn.danger:hover { background: rgba(255,123,123,0.08); }

  .spacer { flex: 1; }

  .exec-indicator {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    border: 1px solid var(--stroke-1);
    background: var(--bg-1);
  }
  .exec-indicator .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text-3);
  }
  .exec-indicator.running .pulse { background: var(--run); box-shadow: 0 0 10px var(--run); animation: pulse 1.4s ease-in-out infinite; }
  .exec-indicator.paused .pulse { background: var(--paused); }
  .exec-indicator.success .pulse { background: var(--ok); }
  .exec-indicator.failed .pulse { background: var(--err); }
  .exec-indicator.cancelled .pulse { background: var(--cancel); }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }

  /* ============ PALETTE ============ */
  .palette {
    grid-area: palette;
    background: var(--bg-1);
    border-right: 1px solid var(--stroke-1);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .palette-search {
    padding: 12px;
    border-bottom: 1px solid var(--stroke-1);
    position: sticky; top: 0;
    background: var(--bg-1);
    z-index: 2;
  }
  .palette-search input {
    background: var(--bg-2);
    padding-left: 28px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b909c' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>");
    background-repeat: no-repeat;
    background-position: 8px center;
  }

  .palette-workflows {
    padding: 10px 12px;
    border-bottom: 1px solid var(--stroke-1);
  }
  .palette-workflows-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .wf-item {
    padding: 7px 9px;
    border-radius: 5px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
    color: var(--text-1);
    cursor: pointer;
    margin-bottom: 2px;
  }
  .wf-item:hover { background: var(--bg-3); color: var(--text-0); }
  .wf-item.active { background: var(--bg-3); color: var(--text-0); box-shadow: inset 2px 0 0 var(--accent); }
  .wf-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-item-del { opacity: 0; color: var(--text-3); padding: 2px; }
  .wf-item:hover .wf-item-del { opacity: 1; }
  .wf-item-del:hover { color: var(--err); }

  .palette-section {
    padding: 10px 12px 4px;
  }
  .palette-section-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 6px;
    padding: 0 2px;
  }
  .palette-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 9px;
    border-radius: 6px;
    margin-bottom: 3px;
    cursor: grab;
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }
  .palette-item:hover { background: var(--bg-3); border-color: var(--stroke-1); }
  .palette-item:active { cursor: grabbing; }
  .palette-item-icon {
    width: 26px; height: 26px;
    border-radius: 6px;
    display: grid; place-items: center;
    background: var(--bg-3);
    flex-shrink: 0;
    position: relative;
  }
  .palette-item-icon::before {
    content: ""; position: absolute; inset: 0; border-radius: 6px;
    background: currentColor; opacity: 0.12;
  }
  .palette-item-icon svg { width: 14px; height: 14px; position: relative; z-index: 1; }
  .palette-item-text { flex: 1; min-width: 0; }
  .palette-item-name { font-weight: 500; font-size: 12px; color: var(--text-0); }
  .palette-item-desc { color: var(--text-3); font-size: 10.5px; line-height: 1.3; }

  /* ============ CANVAS ============ */
  .canvas-area {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 50%, var(--panel-glass-tint), transparent 60%),
      var(--canvas-bg);
  }
  :root[data-theme="light"] .canvas-area {
    box-shadow: inset 1px 0 0 var(--stroke-1), inset -1px 0 0 var(--stroke-1);
  }
  .canvas {
    position: absolute; inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas.panning { cursor: grabbing; }
  .canvas-inner {
    position: absolute;
    transform-origin: 0 0;
    width: 10000px;
    height: 10000px;
    left: 0; top: 0;
  }
  .canvas-grid {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }
  .canvas svg.edges {
    position: absolute; left: 0; top: 0;
    width: 10000px; height: 10000px;
    pointer-events: none;
    overflow: visible;
  }
  .canvas svg.edges .edge-path { pointer-events: stroke; cursor: pointer; }

  .canvas-hud {
    position: absolute; bottom: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 5;
  }
  .zoom-ctrls {
    display: flex; flex-direction: column;
    background: var(--bg-1);
    border: 1px solid var(--stroke-1);
    border-radius: 8px;
    overflow: hidden;
  }
  .zoom-ctrls button {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    color: var(--text-1);
    border-bottom: 1px solid var(--stroke-1);
  }
  .zoom-ctrls button:last-child { border-bottom: 0; }
  .zoom-ctrls button:hover { background: var(--bg-3); color: var(--text-0); }
  .zoom-level {
    background: var(--bg-1);
    border: 1px solid var(--stroke-1);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-2);
    text-align: center;
  }

  /* ============ NODES ============ */
  .node {
    position: absolute;
    width: auto;
    min-width: 220px;
    background: linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 100%);
    border: 1px solid var(--stroke-1);
    border-radius: 10px;
    box-shadow: var(--node-shadow);
    transition: border-color 0.14s, box-shadow 0.14s, transform 0.08s;
    cursor: grab;
    font-size: 12px;
  }
  .node:hover { border-color: var(--stroke-2); }
  .node.selected {
    border-color: var(--accent);
    box-shadow:
      0 0 0 1px var(--accent),
      0 0 28px -8px var(--accent),
      var(--node-shadow);
    z-index: 2;
  }
  .node.dragging,
  .node.dragging * { pointer-events: none; }
  .node.dragging { cursor: grabbing; opacity: 0.85; }
  .branch-port.reparent-target,
  .container-body.reparent-target {
    border-color: var(--accent);
    background: rgba(229,179,106,0.16);
  }

  .node-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    border-bottom: 1px solid var(--stroke-1);
    position: relative;
  }
  .node-head-accent {
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    border-radius: 10px 0 0 10px;
    background: currentColor;
  }
  .node-icon {
    width: 20px; height: 20px;
    border-radius: 5px;
    display: grid; place-items: center;
    background: var(--bg-3);
    position: relative;
    flex-shrink: 0;
  }
  .node-icon::before {
    content: ""; position: absolute; inset: 0; border-radius: 5px;
    background: currentColor; opacity: 0.16;
  }
  .node-icon svg { width: 12px; height: 12px; color: currentColor; position: relative; z-index: 1; }
  .node-title {
    flex: 1; min-width: 0;
    font-weight: 500;
    color: var(--text-0);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 12px;
  }
  .node-type-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    padding: 2px 5px;
    border-radius: 3px;
    background: var(--bg-1);
  }
  .node-body {
    padding: 8px 10px;
    color: var(--text-2);
    font-size: 11.5px;
    min-height: 18px;
    position: relative;
  }
  .node-body-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
  }
  .node-body-row .lab { color: var(--text-3); }
  .node-body-row .val { color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Ports */
  .port {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--bg-4);
    border: 2px solid var(--stroke-3);
    cursor: crosshair;
    z-index: 3;
    transition: transform 0.1s, background 0.12s, border-color 0.12s;
  }
  .port:hover { transform: scale(1.4); background: var(--accent); border-color: var(--accent); }
  .port.connecting { background: var(--accent); border-color: var(--accent); transform: scale(1.3); }
  .port.in { top: -7px; left: 50%; transform: translateX(-50%); }
  .port.in:hover { transform: translateX(-50%) scale(1.4); }
  .port.out { bottom: -7px; left: 50%; transform: translateX(-50%); }
  .port.out:hover { transform: translateX(-50%) scale(1.4); }
  .port.error {
    /* Lives inside .node-body, so it stays anchored to the body row regardless of
       how the branches/children below grow. */
    top: 50%; right: -7px;
    transform: translateY(-50%);
    background: var(--bg-4); border-color: var(--err);
  }
  .port.error:hover { transform: translateY(-50%) scale(1.4); background: var(--err); }
  .port-label {
    position: absolute;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    font-family: 'JetBrains Mono', monospace;
    pointer-events: none;
    font-weight: 600;
  }

  /* Branch ports for if/else/switch */
  .branch-ports {
    display: flex;
    padding: 6px 10px 14px;
    gap: 8px;
    border-top: 1px solid var(--stroke-1);
    background: rgba(0,0,0,0.18);
    border-radius: 0 0 10px 10px;
    align-items: stretch;
  }
  .branch-port {
    flex: 1;
    position: relative;
    padding: 6px 6px 16px;
    border-radius: 5px;
    background: var(--bg-1);
    border: 1px dashed var(--stroke-1);
    font-size: 10px;
    color: var(--text-2);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-width: 96px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.12s, background 0.12s;
  }
  /* When children get added, give the slot more breathing room */
  .branch-port:has(> .branch-port-children > .node) { min-width: 200px; }
  .branch-port-label { text-align: center; }
  .branch-port-children {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 8px;
  }
  .container-children {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  /* Visible connector arrow rendered between consecutive sibling children inside a slot,
     so users see that they are wired in sequence. */
  .sibling-connector {
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--stroke-3);
    pointer-events: none;
    height: 18px;
    margin: 0;
  }
  .sibling-connector svg { display: block; }
  .branch-port-empty {
    text-align: center;
    color: var(--text-3);
    font-size: 10px;
    padding: 14px 6px;
    border: 1px dashed var(--stroke-1);
    border-radius: 4px;
    background: rgba(255,255,255,0.015);
    text-transform: none;
    letter-spacing: 0;
  }
  .branch-port .port {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
  }
  .branch-port .port:hover { transform: translateX(-50%) scale(1.4); }
  .branch-port.drop-active,
  .container-body.drop-active {
    border-color: var(--accent);
    background: rgba(229,179,106,0.10);
  }

  /* Nested child nodes inside a branch slot or container body */
  .node.nested {
    position: relative !important;
    left: auto !important;
    top: auto !important;
    width: auto !important;
    min-width: 0;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 0 0 1px rgba(255,255,255,0.04),
      0 2px 6px rgba(0,0,0,0.5);
  }
  .node.nested .node-head { padding: 6px 8px; }
  .node.nested .node-body { padding: 6px 8px; font-size: 11px; }
  .node.nested > .port.in,
  .node.nested > .port.out,
  .node.nested .port.error {
    /* Keep visible so nested edges/insertion stays clear */
    width: 8px; height: 8px;
  }
  .node.nested .port.error { right: -5px; }

  /* Insertion drop zones above/below each node — only present while a palette drag is active */
  .drop-zone {
    position: absolute;
    left: 8px;
    right: 8px;
    height: 14px;
    z-index: 4;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s, background 0.1s, height 0.1s;
  }
  .drop-zone.above { top: -10px; }
  .drop-zone.below { bottom: -10px; }
  /* Error drop band sits next to the error port on the body row's right edge.
     It's a child of .node-body / .container-body, so it fills the body's height. */
  .drop-zone.error-right {
    top: -4px; bottom: -4px;
    left: auto; right: -10px;
    width: 14px;
    height: auto;
  }
  body.dragging-palette .drop-zone {
    pointer-events: auto;
    opacity: 1;
    background: rgba(229,179,106,0.14);
    border: 1px dashed var(--accent);
  }
  body.dragging-palette .drop-zone:hover,
  body.dragging-palette .drop-zone.drop-active {
    background: var(--accent);
    border-color: var(--accent);
  }
  /* Nested children get explicit gap slots between siblings, so per-child above/below
     bands would be redundant (and would overlap). Hide them. */
  body.dragging-palette .node.nested > .drop-zone.above,
  body.dragging-palette .node.nested > .drop-zone.below { display: none; }

  /* Inline "drop here" slots that appear between sibling children inside a slot
     while a palette item is being dragged. */
  .gap-drop-slot {
    height: 0;
    margin: 0;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-align: center;
    transition: height 0.1s, opacity 0.1s, background 0.1s;
  }
  body.dragging-palette .gap-drop-slot {
    pointer-events: auto;
    opacity: 1;
    height: 22px;
    line-height: 22px;
    background: rgba(229,179,106,0.10);
    border: 1px dashed var(--accent);
  }
  body.dragging-palette .gap-drop-slot::before { content: 'Drop here'; }
  body.dragging-palette .gap-drop-slot.drop-active {
    background: var(--accent);
    color: var(--accent-btn-text);
  }

  /* Node status ring */
  .node::after {
    content: "";
    position: absolute; inset: -3px;
    border-radius: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .node[data-status="running"]::after {
    opacity: 1;
    box-shadow: 0 0 0 2px var(--run), 0 0 24px -4px var(--run);
    animation: runningPulse 1.8s ease-in-out infinite;
  }
  .node[data-status="success"]::after { opacity: 1; box-shadow: 0 0 0 1px var(--ok); }
  .node[data-status="failed"]::after { opacity: 1; box-shadow: 0 0 0 2px var(--err), 0 0 18px -4px var(--err); }
  .node[data-status="cancelled"]::after { opacity: 1; box-shadow: 0 0 0 1px var(--cancel); }
  .node[data-status="paused"]::after { opacity: 1; box-shadow: 0 0 0 1px var(--paused); }
  @keyframes runningPulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--run), 0 0 16px -4px var(--run); }
    50% { box-shadow: 0 0 0 3px var(--run), 0 0 30px -2px var(--run); }
  }

  .node-status-badge {
    position: absolute; top: -8px; right: 10px;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
  }
  .node[data-status]:not([data-status=""]) .node-status-badge {
    opacity: 1; transform: translateY(0);
  }
  .node[data-status="running"] .node-status-badge { background: var(--run); color: #3a2a00; }
  .node[data-status="success"] .node-status-badge { background: var(--ok); color: #003a20; }
  .node[data-status="failed"] .node-status-badge { background: var(--err); color: #400; }
  .node[data-status="cancelled"] .node-status-badge { background: var(--cancel); color: #222; }
  .node[data-status="paused"] .node-status-badge { background: var(--paused); color: #001a3a; }
  /* Light-theme status/accent text must contrast with the saturated (darker) status colors */
  :root[data-theme="light"] .node-status-badge { color: #ffffff !important; }

  /* Container node */
  .node.container {
    background: linear-gradient(180deg, rgba(155,163,180,0.05) 0%, rgba(155,163,180,0.02) 100%);
    border: 1px dashed var(--stroke-2);
    border-radius: 12px;
    min-height: 140px;
  }
  .node.container.collapsed { min-height: auto; }
  .node.container .container-body {
    padding: 10px;
    min-height: 80px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-radius: 0 0 11px 11px;
    transition: background 0.12s, border-color 0.12s;
    border: 1px dashed transparent;
  }
  .node.container.collapsed .container-body { display: none; }
  .node.container .container-hint {
    color: var(--text-3);
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    pointer-events: none;
    text-align: center;
    padding: 18px 6px;
    border: 1px dashed var(--stroke-1);
    border-radius: 4px;
  }
  .node.container .container-child-count {
    font-size: 10px;
    color: var(--text-3);
    font-family: 'JetBrains Mono', monospace;
  }
  .collapse-btn {
    width: 16px; height: 16px;
    display: grid; place-items: center;
    border-radius: 3px;
    color: var(--text-2);
    transition: background 0.12s, transform 0.18s;
  }
  .collapse-btn:hover { background: var(--bg-4); }
  .node.container.collapsed .collapse-btn svg { transform: rotate(-90deg); }
  .collapse-btn svg { transition: transform 0.18s; }

  /* Edge drag preview line */
  .drag-edge-preview {
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 4 4;
    fill: none;
    pointer-events: none;
    animation: dashMove 0.6s linear infinite;
  }
  @keyframes dashMove { to { stroke-dashoffset: -16; } }

  /* Edge styling */
  .edge-path {
    stroke: var(--stroke-3);
    stroke-width: 1.6;
    fill: none;
    transition: stroke 0.12s, stroke-width 0.12s;
  }
  .edge-path:hover { stroke: var(--text-1); stroke-width: 2.2; }
  .edge-path.selected { stroke: var(--accent); stroke-width: 2.4; }
  .edge-path.error-edge { stroke: var(--err); stroke-dasharray: 4 3; opacity: 0.7; }
  .edge-path.error-edge:hover { opacity: 1; }
  .edge-path.active {
    stroke: var(--run);
    stroke-width: 2.4;
    filter: drop-shadow(0 0 6px var(--run));
  }
  .edge-flow {
    stroke: var(--run);
    stroke-width: 2.4;
    fill: none;
    stroke-dasharray: 8 6;
    animation: flowDash 1.2s linear infinite;
    filter: drop-shadow(0 0 4px var(--run));
    pointer-events: none;
  }
  @keyframes flowDash { to { stroke-dashoffset: -28; } }

  .edge-label {
    fill: var(--text-2);
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .edge-label-bg {
    fill: var(--bg-1);
    stroke: var(--stroke-1);
  }

  /* ============ INSPECTOR ============ */
  .inspector {
    grid-area: inspector;
    background: var(--bg-1);
    border-left: 1px solid var(--stroke-1);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .ins-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--stroke-1);
    position: sticky; top: 0;
    background: var(--bg-1);
    z-index: 2;
  }
  .ins-title {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 3px;
  }
  .ins-title-text { font-weight: 600; font-size: 13px; }
  .ins-subtitle { color: var(--text-3); font-size: 11px; font-family: 'JetBrains Mono', monospace; }

  .ins-empty {
    flex: 1;
    display: grid;
    place-items: center;
    color: var(--text-3);
    font-size: 12px;
    text-align: center;
    padding: 40px 20px;
  }
  .ins-empty-icon {
    width: 48px; height: 48px;
    margin: 0 auto 12px;
    opacity: 0.3;
  }

  .ins-section {
    padding: 14px;
    border-bottom: 1px solid var(--stroke-1);
  }
  .ins-section-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .ins-field { margin-bottom: 10px; }
  .ins-field:last-child { margin-bottom: 0; }
  .ins-field-label {
    display: block;
    font-size: 10.5px;
    color: var(--text-2);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .ins-field-hint {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 3px;
    line-height: 1.4;
  }

  .switch-cases-list { display: flex; flex-direction: column; gap: 6px; }
  .switch-case {
    display: flex; gap: 6px; align-items: center;
  }
  .switch-case input { flex: 1; }
  .switch-case-del {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: 4px;
    color: var(--text-3);
    flex-shrink: 0;
  }
  .switch-case-del:hover { background: var(--bg-3); color: var(--err); }
  .add-case-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px;
    border: 1px dashed var(--stroke-1);
    border-radius: 5px;
    color: var(--text-2);
    font-size: 11px;
    width: 100%;
    margin-top: 6px;
  }
  .add-case-btn:hover { border-color: var(--stroke-3); color: var(--text-0); }

  /* ============ LOGS ============ */
  .logs {
    grid-area: logs;
    background: var(--bg-1);
    border-top: 1px solid var(--stroke-1);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .logs-header {
    display: flex; align-items: center; padding: 8px 14px; gap: 10px;
    border-bottom: 1px solid var(--stroke-1);
    flex-shrink: 0;
  }
  .logs-title {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-2);
    font-weight: 600;
  }
  .logs-count {
    font-size: 10px;
    color: var(--text-3);
    font-family: 'JetBrains Mono', monospace;
  }
  .logs-clear {
    color: var(--text-3);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .logs-clear:hover { background: var(--bg-3); color: var(--text-0); }
  .logs-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-2);
  }
  .log-line {
    display: flex; gap: 10px;
    padding: 2px 0;
    line-height: 1.6;
  }
  .log-time { color: var(--text-3); flex-shrink: 0; }
  .log-level { text-transform: uppercase; font-weight: 600; flex-shrink: 0; width: 52px; }
  .log-level.info { color: var(--paused); }
  .log-level.success { color: var(--ok); }
  .log-level.warn { color: var(--accent); }
  .log-level.error { color: var(--err); }
  .log-node { color: var(--text-1); flex-shrink: 0; }
  .log-msg { color: var(--text-2); }
  .log-empty { color: var(--text-3); padding: 20px; text-align: center; font-style: italic; }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: grid;
    place-items: center;
  }
  .modal {
    background: var(--bg-2);
    border: 1px solid var(--stroke-2);
    border-radius: 12px;
    padding: 24px;
    min-width: 380px;
    max-width: 90vw;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
  }
  .modal h3 { font-size: 15px; margin-bottom: 6px; }
  .modal p { color: var(--text-2); font-size: 12px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .modal-actions button {
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .modal-btn-secondary { color: var(--text-1); border: 1px solid var(--stroke-1); }
  .modal-btn-secondary:hover { background: var(--bg-3); }
  .modal-btn-danger { background: var(--err); color: var(--accent-btn-text); font-weight: 600; }
  .modal-btn-primary { background: var(--accent); color: var(--accent-btn-text); font-weight: 600; }
  :root[data-theme="dark"] .modal-btn-danger { color: #1a0000; }
  :root[data-theme="light"] .modal-btn-danger { color: #ffffff; }

  /* ============ TOASTS ============ */
  .toasts {
    position: fixed;
    bottom: 200px;
    right: 340px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 2000;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-3);
    border: 1px solid var(--stroke-2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-0);
    min-width: 200px;
    max-width: 320px;
    box-shadow: 0 14px 30px -10px rgba(0,0,0,0.8);
    animation: toastIn 0.2s ease-out;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.success { border-left: 3px solid var(--ok); }
  .toast.error { border-left: 3px solid var(--err); }
  .toast.info { border-left: 3px solid var(--paused); }
  @keyframes toastIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ============ UTIL ============ */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--stroke-1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--stroke-2); }

  .minimap {
    position: absolute;
    top: 14px; right: 14px;
    width: 180px; height: 120px;
    background: var(--bg-1);
    border: 1px solid var(--stroke-1);
    border-radius: 8px;
    overflow: hidden;
    z-index: 5;
  }
  .minimap svg { width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="app">

  <!-- ============ TOPBAR ============ -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">Flow Studio</div>
        <div class="brand-meta mono">workflow designer</div>
      </div>
    </div>

    <div class="wf-title">
      <input id="wfTitleInput" placeholder="Untitled workflow" />
      <span class="wf-status-dot" id="wfStatusDot"></span>
    </div>

    <div class="tb-group">
      <button class="tb-btn" onclick="App.newWorkflow()" title="New workflow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New
      </button>
      <button class="tb-btn" onclick="App.saveWorkflow()" title="Save (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        Save
      </button>
      <button class="tb-btn" onclick="App.importWorkflow()" title="Import JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Import
      </button>
      <button class="tb-btn" onclick="App.exportWorkflow()" title="Export JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        Export
      </button>
      <button class="tb-btn danger" onclick="App.deleteWorkflow()" title="Delete this workflow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        Delete
      </button>
    </div>

    <div class="spacer"></div>

    <button class="tb-btn" id="themeToggle" onclick="App.toggleTheme()" aria-label="Toggle light / dark theme" title="Toggle light / dark theme" style="padding: 6px 10px; border: 1px solid var(--stroke-1); border-radius: 8px; background: var(--bg-1);">
      <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>

    <div class="exec-indicator" id="execIndicator">
      <span class="pulse"></span>
      <span id="execStatus">IDLE</span>
    </div>

    <div class="tb-group">
      <button class="tb-btn" id="btnRun" onclick="Exec.run()" title="Run (start fresh)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Run
      </button>
      <button class="tb-btn" id="btnPause" onclick="Exec.pause()" title="Pause" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        Pause
      </button>
      <button class="tb-btn" id="btnResume" onclick="Exec.resume()" title="Resume from where paused/failed" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Resume
      </button>
      <button class="tb-btn" id="btnRerun" onclick="Exec.rerun()" title="Rerun from beginning" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Rerun
      </button>
      <button class="tb-btn danger" id="btnCancel" onclick="Exec.cancel()" title="Cancel" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
        Cancel
      </button>
    </div>
  </div>

  <!-- ============ PALETTE ============ -->
  <div class="palette" id="palette">
    <div class="palette-search">
      <input placeholder="Search components…" oninput="App.filterPalette(this.value)" />
    </div>

    <div class="palette-workflows">
      <div class="palette-workflows-title">
        <span>Workflows</span>
        <button onclick="App.newWorkflow()" style="color:var(--text-3); font-size:14px; line-height:1;">+</button>
      </div>
      <div id="wfList"></div>
    </div>

    <div id="paletteSections"></div>
  </div>

  <!-- ============ CANVAS ============ -->
  <div class="canvas-area">
    <div class="canvas" id="canvas">
      <div class="canvas-inner" id="canvasInner">

const PaletteOrder = [
  { category: 'Trigger', types: ['start', 'trigger'] },
  { category: 'Actions', types: ['action', 'http', 'transform', 'delay', 'log'] },
  { category: 'Flow Control', types: ['if', 'switch', 'parallel', 'loop', 'end'] },
  { category: 'AI', types: ['ai'] },
  { category: 'Containers', types: ['container', 'subflow'] },
];

// -------------------- STATE --------------------
const State = {
  workflows: {},        // { id: {id, name, nodes:[], edges:[], createdAt, updatedAt} }
  currentWfId: null,
  nodes: new Map(),     // id -> node
  edges: new Map(),     // id -> edge
  selection: { kind: null, id: null }, // 'node' | 'edge'
  canvas: { x: 200, y: 120, zoom: 1 },
  isDirty: false,
  lastSaved: null,
  logs: [],
};

// -------------------- UTILS --------------------
const uid = (p='n') => p + '_' + Math.random().toString(36).slice(2, 9);
const now = () => Date.now();
const clone = (v) => JSON.parse(JSON.stringify(v));

// Slot names for a node (branch names for if/switch/parallel/loop, '_body' for container).
function getSlots(node) {
  if (!node) return [];
  const t = NodeTypes[node.type];
  if (t && t.branches) return node.branches || t.branches;
  if (node.type === 'container') return ['_body'];
  return [];
}
function ensureChildren(node) {
  const slots = getSlots(node);
  if (!slots.length) return;
  if (!node.children) node.children = {};
  slots.forEach(s => { if (!node.children[s]) node.children[s] = []; });
}

function toast(msg, kind='info', ms=2800) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; }, ms - 300);
  setTimeout(() => el.remove(), ms);
}

// Port positions in canvasInner coordinate space.
// Prefers live DOM measurement (so nested children + grown branch slots stay accurate),
// falls back to math when the DOM hasn't been rendered yet.
function getPortPos(node, portKind, portName) {
  const dom = getPortPosFromDom(node.id, portKind, portName);
  if (dom) return dom;

  const width = node.width || 220;
  const headH = 38;
  const bodyH = 32;
  const branchH = 48;
  const type = NodeTypes[node.type];

  let height = headH + bodyH;
  if (type.branches && type.branches.length) height += branchH;
  if (node.type === 'container') height = Math.max(160, node.height || 160);
  node._cachedHeight = height;

  if (portKind === 'in') return { x: node.x + width/2, y: node.y };
  if (portKind === 'out') return { x: node.x + width/2, y: node.y + height };
  if (portKind === 'error') return { x: node.x + width, y: node.y + headH + bodyH/2 };
  if (portKind === 'branch') {
    const branches = type.branches || [];
    const idx = branches.indexOf(portName);
    if (idx < 0) return { x: node.x + width/2, y: node.y + height };
    const bw = (width - 20 - (branches.length - 1) * 8) / branches.length;
    const bx = 10 + idx * (bw + 8) + bw/2;
    return { x: node.x + bx, y: node.y + height };
  }
  return { x: node.x, y: node.y };
}

function getPortPosFromDom(nodeId, portKind, portName) {
  const inner = document.getElementById('canvasInner');
  if (!inner) return null;
  let portEl = null;
  if (portKind === 'branch') {
    portEl = document.querySelector(
      `.node[data-id="${nodeId}"] > .branch-ports > .branch-port[data-branch="${CSS.escape(portName)}"] > .port`
    );
  } else {
    portEl = document.querySelector(`.node[data-id="${nodeId}"] > .port.${portKind}`);
  }
  if (!portEl || !portEl.isConnected) return null;
  // getBoundingClientRect accounts for CSS transforms on the port (translateX(-50%)) and the
  // canvasInner's pan/zoom transform. We undo the zoom to land back in untransformed space.
  const innerRect = inner.getBoundingClientRect();
  const portRect = portEl.getBoundingClientRect();
  const zoom = (State && State.canvas && State.canvas.zoom) || 1;
  return {
    x: (portRect.left + portRect.width / 2 - innerRect.left) / zoom,
    y: (portRect.top + portRect.height / 2 - innerRect.top) / zoom,
  };
}

// -------------------- CANVAS --------------------
const Canvas = {
  el: null,
  inner: null,

  init() {
    this.el = document.getElementById('canvas');
    this.inner = document.getElementById('canvasInner');

    // Pan
    let panning = false, panStart = null;
    this.el.addEventListener('pointerdown', (e) => {
      if (e.target === this.el || e.target.classList.contains('canvas-grid') || e.target.id === 'canvasInner') {
        panning = true;
        panStart = { x: e.clientX - State.canvas.x, y: e.clientY - State.canvas.y };
        this.el.classList.add('panning');
        App.select(null);
      }
    });
    window.addEventListener('pointermove', (e) => {
      if (panning) {
        State.canvas.x = e.clientX - panStart.x;
        State.canvas.y = e.clientY - panStart.y;
        this.apply();
      }
    });
    window.addEventListener('pointerup', () => {
      panning = false;
      this.el.classList.remove('panning');
    });

    // Zoom
    this.el.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = -e.deltaY;
      const factor = delta > 0 ? 1.08 : 0.93;
      this.zoomAtPoint(factor, e.clientX, e.clientY);
    }, { passive: false });

    // Drop zone
    this.el.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    this.el.addEventListener('drop', (e) => {
      e.preventDefault();
      const type = e.dataTransfer.getData('text/flow-node');
      if (!type) return;
      const pos = this.screenToCanvas(e.clientX, e.clientY);
      App.createNode(type, pos.x - 110, pos.y - 20);
    });
  },

  apply() {
    this.inner.style.transform = `translate(${State.canvas.x}px, ${State.canvas.y}px) scale(${State.canvas.zoom})`;
    document.getElementById('zoomLevel').textContent = Math.round(State.canvas.zoom * 100) + '%';
    Minimap.render();
  },

  zoom(factor) {
    const rect = this.el.getBoundingClientRect();
    this.zoomAtPoint(factor, rect.left + rect.width/2, rect.top + rect.height/2);
  },

  zoomAtPoint(factor, cx, cy) {
    const newZoom = Math.max(0.2, Math.min(2.5, State.canvas.zoom * factor));
    const rect = this.el.getBoundingClientRect();
    const mx = cx - rect.left;
    const my = cy - rect.top;
    State.canvas.x = mx - (mx - State.canvas.x) * (newZoom / State.canvas.zoom);
    State.canvas.y = my - (my - State.canvas.y) * (newZoom / State.canvas.zoom);
    State.canvas.zoom = newZoom;
    this.apply();
  },

  reset() {
    State.canvas = { x: 200, y: 120, zoom: 1 };
    this.apply();
  },

  fitToView() {
    const nodes = [...State.nodes.values()];
    if (!nodes.length) { this.reset(); return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + (n.width || 220));
      maxY = Math.max(maxY, n.y + (n._cachedHeight || 120));
    });
    const w = maxX - minX + 200;
    const h = maxY - minY + 200;
    const rect = this.el.getBoundingClientRect();
    const zoom = Math.min(rect.width / w, rect.height / h, 1.2);
    State.canvas.zoom = zoom;
    State.canvas.x = -minX * zoom + (rect.width - w * zoom) / 2 + 100 * zoom;
    State.canvas.y = -minY * zoom + (rect.height - h * zoom) / 2 + 100 * zoom;
    this.apply();
  },

  screenToCanvas(x, y) {
    const rect = this.el.getBoundingClientRect();
    return {
      x: (x - rect.left - State.canvas.x) / State.canvas.zoom,
      y: (y - rect.top - State.canvas.y) / State.canvas.zoom
    };
  }
};

// -------------------- MINIMAP --------------------
const Minimap = {
  render() {
    const svg = document.getElementById('minimapSvg');
    const nodes = [...State.nodes.values()].filter(n => !n.parentId);
    if (!nodes.length) { svg.innerHTML = ''; return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 220);
      maxY = Math.max(maxY, n.y + 100);
    });
    const pad = 40;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const w = maxX - minX, h = maxY - minY;
    svg.setAttribute('viewBox', `${minX} ${minY} ${w} ${h}`);

    let html = '';
    nodes.forEach(n => {
      const c = NodeTypes[n.type].color;
      html += `<rect x="${n.x}" y="${n.y}" width="220" height="80" rx="8" fill="${c}" opacity="0.5"/>`;
    });

    // Viewport indicator
    const rect = Canvas.el.getBoundingClientRect();
    const vx = -State.canvas.x / State.canvas.zoom;
    const vy = -State.canvas.y / State.canvas.zoom;
    const vw = rect.width / State.canvas.zoom;
    const vh = rect.height / State.canvas.zoom;
    html += `<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="none" stroke="#d4a657" stroke-width="3" stroke-dasharray="6 4"/>`;

    svg.innerHTML = html;
  }
};

// -------------------- NODE RENDERING --------------------
const Nodes = {
  render() {
    const layer = document.getElementById('nodesLayer');
    // Top-level nodes only at the layer level; nested ones are rendered inside their parents.
    const topLevel = [...State.nodes.values()].filter(n => !n.parentId);
    const presentIds = new Set(topLevel.map(n => n.id));
    layer.querySelectorAll(':scope > .node').forEach(el => {
      if (!presentIds.has(el.dataset.id)) el.remove();
    });
    topLevel.forEach(node => {
      let el = layer.querySelector(`:scope > .node[data-id="${node.id}"]`);
      if (!el) {
        el = this.createElement(node, false);
        layer.appendChild(el);
      } else {
        this.refreshElement(el, node, false);
      }
      this.renderChildrenInto(el, node);
    });
  },

  // Render the descendants of `parentNode` into the slot containers within `parentEl`.
  renderChildrenInto(parentEl, parentNode) {
    const slots = getSlots(parentNode);
    if (!slots.length) return;
    ensureChildren(parentNode);
    slots.forEach(slot => {
      const slotEl = this.findSlotEl(parentEl, parentNode, slot);
      if (!slotEl) return;
      const childIds = (parentNode.children && parentNode.children[slot]) || [];
      // Rebuild children area each render — simple and correct for the demo.
      slotEl.innerHTML = '';
      if (!childIds.length) {
        const empty = document.createElement('div');
        empty.className = parentNode.type === 'container' ? 'container-hint' : 'branch-port-empty';
        empty.textContent = 'Drop component';
        slotEl.appendChild(empty);
      } else {
        // Render: gap[0] child[0] connector gap[1] child[1] connector gap[2] ...
        // (a connector goes between consecutive children; the gap-drop-slots are the drop targets)
        slotEl.appendChild(this.makeGapSlot(parentNode.id, slot, 0));
        childIds.forEach((cid, i) => {
          const child = State.nodes.get(cid);
          if (!child) return;
          const childEl = this.createElement(child, true);
          slotEl.appendChild(childEl);
          this.renderChildrenInto(childEl, child);
          if (i < childIds.length - 1) {
            slotEl.appendChild(this.makeSiblingConnector());
          }
          slotEl.appendChild(this.makeGapSlot(parentNode.id, slot, i + 1));
        });
      }
    });
  },

  makeSiblingConnector() {
    const el = document.createElement('div');
    el.className = 'sibling-connector';
    el.innerHTML = '<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true">' +
      '<path d="M6 0 V 12" stroke="currentColor" stroke-width="1.4" fill="none"/>' +
      '<path d="M2.5 11 L 6 16 L 9.5 11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
    return el;
  },

  makeGapSlot(parentId, slot, index) {
    const gap = document.createElement('div');
    gap.className = 'gap-drop-slot';
    gap.dataset.parentId = parentId;
    gap.dataset.slot = slot;
    gap.dataset.index = String(index);
    gap.addEventListener('dragover', (e) => {
      if (!e.dataTransfer.types.includes('text/flow-node')) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
      gap.classList.add('drop-active');
    });
    gap.addEventListener('dragleave', () => gap.classList.remove('drop-active'));
    gap.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      gap.classList.remove('drop-active');
      const type = e.dataTransfer.getData('text/flow-node');
      if (!type) return;
      App.createChildNode(type, parentId, slot, index);
    });
    return gap;
  },

  findSlotEl(parentEl, parentNode, slot) {
    if (parentNode.type === 'container' && slot === '_body') {
      return parentEl.querySelector(':scope > .container-body > .container-children');
    }
    return parentEl.querySelector(
      `:scope > .branch-ports > .branch-port[data-branch="${CSS.escape(slot)}"] > .branch-port-children`
    );
  },

  createElement(node, isNested) {
    const el = document.createElement('div');
    el.className = 'node' + (isNested ? ' nested' : '');
    el.dataset.id = node.id;
    el.innerHTML = this.html(node);
    this.refreshElement(el, node, isNested);
    this.attachHandlers(el, node, isNested);
    return el;
  },

  // Updates style/state on an existing top-level element without rebuilding children.
  refreshElement(el, node, isNested) {
    const type = NodeTypes[node.type];
    if (!isNested) {
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
    }
    el.style.color = type.color;
    el.dataset.status = node.status || '';
    el.classList.toggle('selected', State.selection.kind === 'node' && State.selection.id === node.id);
    if (node.type === 'container') {
      el.classList.add('container');
      el.classList.toggle('collapsed', !!node.collapsed);
    }
    const headTitle = el.querySelector(':scope > .node-head > .node-title');
    if (headTitle) headTitle.textContent = node.name || type.label;
    const bodyEl = el.querySelector(':scope > .node-body');
    if (bodyEl) bodyEl.innerHTML = this.bodyHtml(node);
  },

  html(node) {
    const type = NodeTypes[node.type];
    const ports = type.ports;
    let portsHtml = '';
    if (ports.in) portsHtml += `<div class="port in" data-port-kind="in" data-node-id="${node.id}"></div>`;
    if (ports.out && !type.branches) portsHtml += `<div class="port out" data-port-kind="out" data-node-id="${node.id}"></div>`;
    // Note: error port is rendered INSIDE the body so its position stays anchored to the
    // body row even as branches/children below cause the node to grow taller.
    const errorPortHtml = (ports.error && !type.branches)
      ? `<div class="port error" data-port-kind="error" data-node-id="${node.id}" title="onError"></div>`
      : '';

    const branchesHtml = type.branches ? this.branchHtml(node) : '';

    const collapseBtn = node.type === 'container'
      ? `<button class="collapse-btn" onclick="event.stopPropagation(); App.toggleCollapse('${node.id}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>`
      : '';

    const typeLabel = `<span class="node-type-label mono">${node.type}</span>`;

    // Insertion drop zones — above the node (before its onStart) and below (after its onFinish/onError).
    const dropAbove = ports.in ? `<div class="drop-zone above" data-node-id="${node.id}" data-position="before"></div>` : '';
    const dropBelow = (ports.out || type.branches) ? `<div class="drop-zone below" data-node-id="${node.id}" data-position="after"></div>` : '';
    const dropError = (ports.error && !type.branches) ? `<div class="drop-zone error-right" data-node-id="${node.id}" data-position="after-error"></div>` : '';

    const bodyContent = node.type === 'container'
      ? `<div class="container-body"><div class="container-children"></div>${errorPortHtml}${dropError}</div>`
      : `<div class="node-body">${this.bodyHtml(node)}${errorPortHtml}${dropError}</div>`;

    return `
      ${dropAbove}
      <div class="node-status-badge">${node.status || ''}</div>
      <div class="node-head">
        <div class="node-head-accent"></div>
        <div class="node-icon">${type.icon}</div>
        <div class="node-title">${node.name || type.label}</div>
        ${collapseBtn || typeLabel}
      </div>
      ${bodyContent}
      ${portsHtml}
      ${branchesHtml}
      ${dropBelow}
    `;
  },

  bodyHtml(node) {
    const type = NodeTypes[node.type];
    const c = node.config || {};
    if (node.type === 'if') return `<div class="node-body-row"><span class="lab">if</span><span class="val">${c.condition || '—'}</span></div>`;
    if (node.type === 'switch') return `<div class="node-body-row"><span class="lab">switch</span><span class="val">${c.expression || '—'}</span></div>`;
    if (node.type === 'loop') return `<div class="node-body-row"><span class="lab">${c.mode}</span><span class="val">${c.source || '—'}</span></div>`;
    if (node.type === 'ai') {
      const binding = c.mode === 'skill' ? (c.skillId || '—') : (c.subagentId || '—');
      return `<div class="node-body-row"><span class="lab">${c.mode}</span><span class="val">${binding}</span></div><div class="node-body-row"><span class="lab">model</span><span class="val">${c.model}</span></div>`;
    }
    if (node.type === 'http') return `<div class="node-body-row"><span class="lab">${c.method}</span><span class="val">${c.url || '—'}</span></div>`;
    if (node.type === 'delay') return `<div class="node-body-row"><span class="lab">wait</span><span class="val">${c.duration}${c.unit}</span></div>`;
    if (node.type === 'subflow') return `<div class="node-body-row"><span class="lab">flow</span><span class="val">${c.workflowId ? (State.workflows[c.workflowId]?.name || c.workflowId) : '—'}</span></div>`;
    if (node.type === 'start') return `<div class="node-body-row"><span class="lab">trigger</span><span class="val">${c.triggerType}</span></div>`;
    if (node.type === 'transform') return `<div class="node-body-row"><span class="lab">expr</span><span class="val">${c.expression || '—'}</span></div>`;
    if (node.type === 'log') return `<div class="node-body-row"><span class="lab">${c.level}</span><span class="val">${c.message || '—'}</span></div>`;
    if (node.type === 'parallel') return `<div class="node-body-row"><span class="lab">join</span><span class="val">${c.joinMode}</span></div>`;
    if (node.type === 'end') return `<div class="node-body-row"><span class="lab">status</span><span class="val">${c.status}</span></div>`;
    return `<div class="node-body-row"><span class="lab">type</span><span class="val">${type.label}</span></div>`;
  },

  branchHtml(node) {
    const type = NodeTypes[node.type];
    const branches = node.branches || type.branches || [];
    return `<div class="branch-ports">${
      branches.map(b => `
        <div class="branch-port" data-branch="${b}" data-parent-id="${node.id}">
          <div class="branch-port-label">${b}</div>
          <div class="branch-port-children"></div>
          <div class="port" data-port-kind="branch" data-port-name="${b}" data-node-id="${node.id}"></div>
        </div>
      `).join('')
    }</div>`;
  },

  attachHandlers(el, node, isNested) {
    // Position drag (top-level only — nested children flow with their slot)
    if (!isNested) {
      let dragging = false, startPos = null, nodeStart = null, lastHover = null;
      const clearHover = () => {
        if (lastHover) { lastHover.classList.remove('reparent-target'); lastHover = null; }
      };
      const findSlotAt = (clientX, clientY) => {
        const target = document.elementFromPoint(clientX, clientY);
        if (!target) return null;
        const branchEl = target.closest('.branch-port[data-parent-id]');
        if (branchEl) {
          const parentEl = branchEl.closest('.node');
          const parentId = parentEl && parentEl.dataset.id;
          if (parentId && parentId !== node.id && !App.isDescendantOf(parentId, node.id)) {
            return { el: branchEl, parentId, slot: branchEl.dataset.branch };
          }
        }
        const bodyEl = target.closest('.container-body');
        if (bodyEl) {
          const parentEl = bodyEl.closest('.node.container');
          const parentId = parentEl && parentEl.dataset.id;
          if (parentId && parentId !== node.id && !App.isDescendantOf(parentId, node.id)) {
            return { el: bodyEl, parentId, slot: '_body' };
          }
        }
        return null;
      };
      el.addEventListener('pointerdown', (e) => {
        if (e.target.classList.contains('port')) return;
        if (e.target.closest('.collapse-btn')) return;
        if (e.target.classList.contains('drop-zone')) return;
        e.stopPropagation();
        App.select('node', node.id);
        dragging = true;
        startPos = { x: e.clientX, y: e.clientY };
        nodeStart = { x: node.x, y: node.y };
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = (e.clientX - startPos.x) / State.canvas.zoom;
        const dy = (e.clientY - startPos.y) / State.canvas.zoom;
        node.x = nodeStart.x + dx;
        node.y = nodeStart.y + dy;
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        // Highlight slot under cursor (if any) for re-parenting feedback.
        const hit = findSlotAt(e.clientX, e.clientY);
        if (hit && hit.el !== lastHover) { clearHover(); lastHover = hit.el; lastHover.classList.add('reparent-target'); }
        else if (!hit) { clearHover(); }
        Edges.render();
        Minimap.render();
        State.isDirty = true;
      });
      el.addEventListener('pointerup', (e) => {
        if (!dragging) return;
        dragging = false;
        // Resolve the slot under the cursor BEFORE we drop the .dragging class — that
        // class is what makes the dragged node and its children pointer-events:none, so
        // elementFromPoint can see what's underneath. Removing it first would cause the
        // dragged node to occlude any slot it's hovering over.
        const hit = findSlotAt(e.clientX, e.clientY);
        el.classList.remove('dragging');
        el.releasePointerCapture(e.pointerId);
        clearHover();
        if (hit) {
          App.reparentNode(node.id, hit.parentId, hit.slot);
        } else {
          App.markDirty();
        }
      });
    } else {
      // Nested: still selectable on click.
      el.addEventListener('pointerdown', (e) => {
        if (e.target.classList.contains('port')) return;
        if (e.target.classList.contains('drop-zone')) return;
        e.stopPropagation();
        App.select('node', node.id);
      });
    }

    // Port handlers (covers both regular and branch ports inside this element only)
    this.attachOwnPortHandlers(el, node);
    // Slot drop handlers (own slots only — children's slots get attached during their own createElement)
    this.attachOwnSlotHandlers(el, node);
    // Insertion drop zones for this node
    this.attachInsertionZones(el, node);
  },

  attachOwnPortHandlers(el, node) {
    // Direct child ports: top-level in/out/error
    el.querySelectorAll(':scope > .port').forEach(port => {
      port.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        Edges.startDrag(port);
      });
    });
    // Branch ports of this node (one level down inside .branch-ports)
    el.querySelectorAll(':scope > .branch-ports > .branch-port > .port').forEach(port => {
      port.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        Edges.startDrag(port);
      });
    });
  },

  attachOwnSlotHandlers(el, node) {
    const slots = getSlots(node);
    slots.forEach(slot => {
      const dropEl = node.type === 'container' && slot === '_body'
        ? el.querySelector(':scope > .container-body')
        : el.querySelector(`:scope > .branch-ports > .branch-port[data-branch="${CSS.escape(slot)}"]`);
      if (!dropEl) return;
      dropEl.addEventListener('dragover', (e) => {
        if (!e.dataTransfer.types.includes('text/flow-node')) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'copy';
        dropEl.classList.add('drop-active');
      });
      dropEl.addEventListener('dragleave', (e) => {
        if (!dropEl.contains(e.relatedTarget)) dropEl.classList.remove('drop-active');
      });
      dropEl.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropEl.classList.remove('drop-active');
        const type = e.dataTransfer.getData('text/flow-node');
        if (!type) return;
        App.createChildNode(type, node.id, slot);
      });
    });
  },

  attachInsertionZones(el, node) {
    el.querySelectorAll(':scope > .drop-zone').forEach(dz => {
      dz.addEventListener('dragover', (e) => {
        if (!e.dataTransfer.types.includes('text/flow-node')) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'copy';
        dz.classList.add('drop-active');
      });
      dz.addEventListener('dragleave', () => dz.classList.remove('drop-active'));
      dz.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dz.classList.remove('drop-active');
        const type = e.dataTransfer.getData('text/flow-node');
        if (!type) return;
        const position = dz.dataset.position; // 'before' | 'after' | 'after-error'
        App.insertNodeRelative(type, node.id, position);
      });
    });
  }
};

// -------------------- EDGES --------------------
const Edges = {
  dragData: null,

  render() {
    const svg = document.getElementById('edgesSvg');
    let html = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--stroke-3)"/></marker><marker id="arrow-err" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--err)"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--run)"/></marker></defs>';

    State.edges.forEach((edge, id) => {
      const src = State.nodes.get(edge.source);
      const tgt = State.nodes.get(edge.target);
      if (!src || !tgt) return;
      const sp = getPortPos(src, edge.sourcePort, edge.sourcePortName);
      const tp = getPortPos(tgt, 'in');
      const path = this.buildPath(sp, tp);
      const isErr = edge.sourcePort === 'error';
      const selected = State.selection.kind === 'edge' && State.selection.id === id;
      const active = edge._active;
      const cls = [
        'edge-path',
        isErr ? 'error-edge' : '',
        selected ? 'selected' : '',
        active ? 'active' : ''
      ].filter(Boolean).join(' ');

      const marker = isErr ? 'url(#arrow-err)' : active ? 'url(#arrow-active)' : 'url(#arrow)';
      html += `<path class="${cls}" d="${path}" data-edge-id="${id}" marker-end="${marker}"/>`;

      // Label for branch ports
      if (edge.sourcePort === 'branch' && edge.sourcePortName) {
        const midX = (sp.x + tp.x) / 2;
        const midY = (sp.y + tp.y) / 2;
        const lbl = edge.sourcePortName;
        const w = lbl.length * 6 + 10;
        html += `<rect class="edge-label-bg" x="${midX - w/2}" y="${midY - 8}" width="${w}" height="16" rx="8"/>`;
        html += `<text class="edge-label" x="${midX}" y="${midY}" text-anchor="middle" dominant-baseline="middle">${lbl}</text>`;
      }

      // Flow animation when active
      if (active) {
        html += `<path class="edge-flow" d="${path}"/>`;
      }
    });

    svg.innerHTML = html;

    // Click handlers
    svg.querySelectorAll('.edge-path').forEach(p => {
      p.addEventListener('click', (e) => {
        e.stopPropagation();
        App.select('edge', p.dataset.edgeId);
      });
    });
  },

  buildPath(s, t) {
    // Pull the end point back along the line so the SVG arrow head lands just outside
    // the destination port instead of being covered by it.
    const dx = t.x - s.x, dy = t.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    const back = Math.min(11, Math.max(0, dist - 2));
    const tx = t.x - dx * back / dist;
    const ty = t.y - dy * back / dist;
    const vdy = Math.abs(ty - s.y);
    const offset = Math.max(40, Math.min(vdy * 0.6, 120));
    return `M ${s.x} ${s.y} C ${s.x} ${s.y + offset}, ${tx} ${ty - offset}, ${tx} ${ty}`;
  },

  startDrag(port) {
    const nodeId = port.dataset.nodeId;
    const portKind = port.dataset.portKind;
    const portName = port.dataset.portName;
    if (portKind === 'in') return; // Only drag from outputs

    const node = State.nodes.get(nodeId);
    if (!node) return;
    const startPos = getPortPos(node,
      portKind === 'branch' ? 'branch' : portKind,
      portName);
    this.dragData = { startPos, nodeId, portKind, portName };

    port.classList.add('connecting');

    const svg = document.getElementById('edgesSvg');
    const preview = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    preview.classList.add('drag-edge-preview');
    svg.appendChild(preview);

    const onMove = (e) => {
      const pos = Canvas.screenToCanvas(e.clientX, e.clientY);
      const path = this.buildPath(startPos, pos);
      preview.setAttribute('d', path);
    };
    const onUp = (e) => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      preview.remove();
      port.classList.remove('connecting');

      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (target && target.classList.contains('port') && target.dataset.portKind === 'in') {
        const targetId = target.dataset.nodeId;
        if (targetId && targetId !== nodeId) {
          App.createEdge({
            source: nodeId,
            sourcePort: portKind,
            sourcePortName: portName,
            target: targetId,
            targetPort: 'in'
          });
        }
      }
      this.dragData = null;
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  },

  getSuccessors(nodeId, portKind, portName) {
    const results = [];
    State.edges.forEach(edge => {
      if (edge.source !== nodeId) return;
      if (portKind && edge.sourcePort !== portKind) return;
      if (portName !== undefined && edge.sourcePortName !== portName) return;
      results.push(edge);
    });
    return results;
  }
};

    let html = '';
    PaletteOrder.forEach(section => {
      html += `<div class="palette-section">
        <div class="palette-section-title">${section.category}</div>`;
      section.types.forEach(type => {
        const t = NodeTypes[type];
        html += `

            <div class="palette-item-icon">${t.icon}</div>
            <div class="palette-item-text">
              <div class="palette-item-name">${t.label}</div>
              <div class="palette-item-desc">${t.desc}</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
    });
    container.innerHTML = html;

    container.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/flow-node', item.dataset.type);

};

    if (kind === 'node') { this.renderNode(id); return; }
  },

  renderEdge(id) {
    const edge = State.edges.get(id);

      <div class="ins-header">
        <div class="ins-title">

        </div>

        <div class="ins-section-title">Connection</div>

        </div>

      <div class="ins-header">

          <div>
            <div class="ins-title-text">${node.name || type.label}</div>

        </div>

          <input readonly value="${id}" class="mono" />
        </div>
      </div>
      ${configHtml}
      <div class="ins-section">

        <div class="ins-field-hint">
          ${type.ports.in ? '• <strong>in</strong> — accepts input<br>' : ''}

        </div>
      </div>
      <div class="ins-section">
        <button class="tb-btn danger" onclick="App.deleteNode('${id}')" style="width:100%; justify-content:center; background:var(--bg-3); padding: 8px; border-radius:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>

    } else if (node.type === 'end') {
      fields = `
