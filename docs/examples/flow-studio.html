      `;
    } else {
      fields = `<div class="ins-field-hint">No additional configuration.</div>`;
    }

    return `<div class="ins-section">
      <div class="ins-section-title">${title}</div>
      ${fields}
    </div>`;
  }
};

// -------------------- APP (orchestrator) --------------------
const App = {
  init() {
    Canvas.init();
    Palette.render();
    this.loadWorkflowsFromStorage();
    if (!State.currentWfId) this.newWorkflow(true);
    this.bindShortcuts();
    this.bindTitleInput();
    this.bindFileInput();
    this.syncThemeIcon();
    this.renderAll();
  },

  syncThemeIcon() {
    const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const dark = document.querySelector('#themeToggle .theme-icon-dark');
    const light = document.querySelector('#themeToggle .theme-icon-light');
    if (dark) dark.style.display = theme === 'dark' ? '' : 'none';
    if (light) light.style.display = theme === 'light' ? '' : 'none';
  },

  renderAll() {
    Canvas.apply();
    Nodes.render();
    Edges.render();
    Inspector.render();
    this.renderWorkflowList();
    this.renderLogs();
    this.renderStatus();
    Minimap.render();
  },

  renderStatus() {
    const dot = document.getElementById('wfStatusDot');
    dot.className = 'wf-status-dot ' + (State.isDirty ? 'dirty' : State.lastSaved ? 'saved' : '');
  },

  markDirty() {
    State.isDirty = true;
    this.renderStatus();
  },

  toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('flow-studio:theme', next); } catch (_) {}
    const dark = document.querySelector('#themeToggle .theme-icon-dark');
    const light = document.querySelector('#themeToggle .theme-icon-light');
    if (dark) dark.style.display = next === 'dark' ? '' : 'none';
    if (light) light.style.display = next === 'light' ? '' : 'none';
  },

  select(kind, id) {
    State.selection = kind ? { kind, id } : { kind: null, id: null };
    Nodes.render();
    Edges.render();
    Inspector.render();
  },

  // ---------- NODE OPS ----------
  createNode(type, x, y, opts = {}) {
    const tpl = NodeTypes[type];
    const node = {
      id: uid('n'),
      type,
      name: tpl.label,
      x, y,
      width: 220,
      config: clone(tpl.config || {}),
      status: '',
      parentId: opts.parentId || null,
      parentSlot: opts.parentSlot || null,
    };
    if (tpl.branches) node.branches = [...tpl.branches];
    if (type === 'container') { node.width = 280; node.height = 180; node.collapsed = false; }
    ensureChildren(node);
    State.nodes.set(node.id, node);
    if (node.parentId) {
      const parent = State.nodes.get(node.parentId);
      if (parent) {
        ensureChildren(parent);
        const arr = parent.children[node.parentSlot];
        const idx = (typeof opts.index === 'number') ? Math.max(0, Math.min(opts.index, arr.length)) : arr.length;
        arr.splice(idx, 0, node.id);
      }
    }
    this.markDirty();
    this.renderAll();
    this.select('node', node.id);
    this.log('info', null, `Created node "${node.name}"`);
    return node.id;
  },

  isDescendantOf(maybeDescendantId, ancestorId) {
    const ancestor = State.nodes.get(ancestorId);
    if (!ancestor || !ancestor.children) return false;
    for (const slot of Object.keys(ancestor.children)) {
      for (const cid of ancestor.children[slot]) {
        if (cid === maybeDescendantId) return true;
        if (this.isDescendantOf(maybeDescendantId, cid)) return true;
      }
    }
    return false;
  },

  reparentNode(nodeId, newParentId, newSlot, index) {
    const node = State.nodes.get(nodeId);
    const newParent = State.nodes.get(newParentId);
    if (!node || !newParent || nodeId === newParentId) return;
    if (this.isDescendantOf(newParentId, nodeId)) return; // prevent cycle
    // Detach from current parent (or canvas)
    if (node.parentId) {
      const oldParent = State.nodes.get(node.parentId);
      if (oldParent && oldParent.children && oldParent.children[node.parentSlot]) {
        oldParent.children[node.parentSlot] = oldParent.children[node.parentSlot].filter(id => id !== nodeId);
      }
    }
    // Attach to new parent
    ensureChildren(newParent);
    const arr = newParent.children[newSlot] || (newParent.children[newSlot] = []);
    if (arr.includes(nodeId)) arr.splice(arr.indexOf(nodeId), 1);
    if (typeof index === 'number') {
      arr.splice(Math.max(0, Math.min(index, arr.length)), 0, nodeId);
    } else {
      arr.push(nodeId);
    }
    node.parentId = newParentId;
    node.parentSlot = newSlot;
    // Drop any edge from newParent's matching branch port that pointed to this node — it's
    // now implicitly the slot's content, so an explicit edge would be redundant.
    [...State.edges.entries()].forEach(([eid, e]) => {
      if (e.source === newParentId && e.sourcePort === 'branch' &&
          e.sourcePortName === newSlot && e.target === nodeId) {
        State.edges.delete(eid);
      }
    });
    this.markDirty();
    this.renderAll();
    this.select('node', nodeId);
    this.log('info', null, `Moved "${node.name}" into ${newParent.name || newParent.type}/${newSlot}`);
  },

  createChildNode(type, parentId, slot, index) {
    const parent = State.nodes.get(parentId);
    if (!parent) return null;
    const slots = getSlots(parent);
    if (!slots.includes(slot)) return null;
    return this.createNode(type, 0, 0, { parentId, parentSlot: slot, index });
  },

  insertNodeRelative(type, refNodeId, position) {
    const ref = State.nodes.get(refNodeId);
    if (!ref) return null;
    if (ref.parentId) {
      const parent = State.nodes.get(ref.parentId);
      const arr = parent.children[ref.parentSlot] || [];
      const idx = arr.indexOf(refNodeId);
      const insertAt = position === 'before' ? idx : idx + 1;
      return this.createChildNode(type, ref.parentId, ref.parentSlot, insertAt);
    }
    // Top-level: try to splice into existing edge; otherwise create alongside.
    const newId = this.createNode(type, ref.x, ref.y + (position === 'before' ? -180 : 180));
    if (position === 'before') {
      const incoming = [...State.edges.values()].find(e => e.target === refNodeId && e.targetPort === 'in');
      if (incoming) {
        incoming.target = newId;
        this.createEdge({ source: newId, sourcePort: 'out', target: refNodeId, targetPort: 'in' });
      }
    } else {
      const sourcePort = position === 'after-error' ? 'error' : 'out';
      const outgoing = [...State.edges.values()].find(e => e.source === refNodeId && e.sourcePort === sourcePort);
      if (outgoing) {
        const oldTarget = outgoing.target;
        outgoing.target = newId;
        this.createEdge({ source: newId, sourcePort: 'out', target: oldTarget, targetPort: 'in' });
      }
    }
    return newId;
  },

  updateNode(id, patch) {
    const node = State.nodes.get(id);
    if (!node) return;
    Object.assign(node, patch);
    this.markDirty();
    Nodes.render();
    Inspector.render();
  },

  updateNodeConfig(id, key, value) {
    const node = State.nodes.get(id);
    if (!node) return;
    node.config = { ...(node.config || {}), [key]: value };
    this.markDirty();
    Nodes.render();
  },

  deleteNode(id) {
    const node = State.nodes.get(id);
    if (!node) return;
    // Detach from parent
    if (node.parentId) {
      const parent = State.nodes.get(node.parentId);
      if (parent && parent.children && parent.children[node.parentSlot]) {
        parent.children[node.parentSlot] = parent.children[node.parentSlot].filter(cid => cid !== id);
      }
    }
    // Cascade-delete descendants
    const collect = (nid, acc = []) => {
      const n = State.nodes.get(nid);
      if (!n) return acc;
      acc.push(nid);
      if (n.children) {
        Object.values(n.children).forEach(arr => arr.forEach(cid => collect(cid, acc)));
      }
      return acc;
    };
    const toDelete = new Set(collect(id));
    toDelete.forEach(nid => State.nodes.delete(nid));
    // Remove edges touching any deleted node
    [...State.edges.entries()].forEach(([eid, e]) => {
      if (toDelete.has(e.source) || toDelete.has(e.target)) State.edges.delete(eid);
    });
    this.markDirty();
    this.select(null);
    this.renderAll();
  },

  toggleCollapse(id) {
    const node = State.nodes.get(id);
    if (!node) return;
    node.collapsed = !node.collapsed;
    this.markDirty();
    this.renderAll();
  },

  addBranch(nodeId) {
    const node = State.nodes.get(nodeId);
    if (!node) return;
    node.branches = node.branches || [];
    node.branches.push(`case_${node.branches.length + 1}`);
    this.markDirty();
    this.renderAll();
  },

  removeBranch(nodeId, index) {
    const node = State.nodes.get(nodeId);
    if (!node || !node.branches) return;
    const removed = node.branches.splice(index, 1)[0];
    // Remove edges on this branch
    [...State.edges.entries()].forEach(([eid, e]) => {
      if (e.source === nodeId && e.sourcePortName === removed) State.edges.delete(eid);
    });
    this.markDirty();
    this.renderAll();
  },

  renameBranch(nodeId, index, newName) {
    const node = State.nodes.get(nodeId);
    if (!node || !node.branches) return;
    const old = node.branches[index];
    node.branches[index] = newName;
    // Update edges referencing the old name
    State.edges.forEach(e => {
      if (e.source === nodeId && e.sourcePortName === old) e.sourcePortName = newName;
    });
    this.markDirty();
    Nodes.render();
    Edges.render();
  },

  // ---------- EDGE OPS ----------
  createEdge({ source, sourcePort, sourcePortName, target, targetPort }) {
    // Prevent duplicate
    for (const e of State.edges.values()) {
      if (e.source === source && e.sourcePort === sourcePort &&
          e.sourcePortName === sourcePortName && e.target === target) return;
    }
    const id = uid('e');
    State.edges.set(id, { id, source, sourcePort, sourcePortName, target, targetPort });
    this.markDirty();
    Edges.render();
    const s = State.nodes.get(source)?.name || '?';
    const t = State.nodes.get(target)?.name || '?';
    this.log('info', null, `Connected ${s} → ${t}`);
  },

  deleteEdge(id) {
    State.edges.delete(id);
    this.markDirty();
    this.select(null);
    Edges.render();
    Inspector.render();
  },

  // ---------- WORKFLOW OPS ----------
  newWorkflow(silent=false) {
    const id = uid('wf');
    const wf = {
      id, name: 'Untitled workflow',
      nodes: [], edges: [],
      createdAt: now(), updatedAt: now()
    };
    State.workflows[id] = wf;
    State.currentWfId = id;
    State.nodes.clear();
    State.edges.clear();
    State.isDirty = false;
    State.logs = [];

    // Seed with a start node
    this.createNode('start', 240, 180);
    State.isDirty = false;
    this.saveToStorage();

    document.getElementById('wfTitleInput').value = wf.name;
    this.renderAll();
    if (!silent) toast('New workflow created', 'success');
  },

  saveWorkflow() {
    const wf = State.workflows[State.currentWfId];
    if (!wf) return;
    wf.name = document.getElementById('wfTitleInput').value || 'Untitled workflow';
    wf.nodes = [...State.nodes.values()];
    wf.edges = [...State.edges.values()];
    wf.updatedAt = now();
    State.isDirty = false;
    State.lastSaved = now();
    this.saveToStorage();
    this.renderAll();
    toast('Workflow saved', 'success');
  },

  loadWorkflow(id) {
    const wf = State.workflows[id];
    if (!wf) return;
    if (State.isDirty) {
      if (!confirm('Discard unsaved changes?')) return;
    }
    State.currentWfId = id;
    State.nodes = new Map((wf.nodes || []).map(n => [n.id, n]));
    State.edges = new Map((wf.edges || []).map(e => [e.id, e]));
    State.isDirty = false;
    State.selection = { kind: null, id: null };
    State.logs = [];
    document.getElementById('wfTitleInput').value = wf.name;
    this.renderAll();
    Canvas.fitToView();
    toast(`Loaded: ${wf.name}`, 'info');
  },

  deleteWorkflow() {
    const wf = State.workflows[State.currentWfId];
    if (!wf) return;
    this.showModal({
      title: 'Delete workflow?',
      body: `"${wf.name}" will be permanently removed.`,
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: () => {
        delete State.workflows[State.currentWfId];
        State.currentWfId = null;
        const remaining = Object.values(State.workflows);
        if (remaining.length) {
          this.loadWorkflow(remaining[0].id);
        } else {
          this.newWorkflow(true);
        }
        this.saveToStorage();
        toast('Workflow deleted', 'info');
      }
    });
  },

  exportWorkflow() {
    const wf = State.workflows[State.currentWfId];
    if (!wf) return;
    wf.name = document.getElementById('wfTitleInput').value || 'Untitled workflow';
    wf.nodes = [...State.nodes.values()];
    wf.edges = [...State.edges.values()];
    const data = JSON.stringify(wf, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${wf.name.replace(/[^a-z0-9]+/gi, '_')}.flow.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Exported JSON', 'success');
  },

  importWorkflow() {
    document.getElementById('fileInput').click();
  },

  handleImport(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.id || !Array.isArray(data.nodes)) throw new Error('Invalid workflow JSON');
        // Ensure unique id
        if (State.workflows[data.id]) data.id = uid('wf');
        data.updatedAt = now();
        State.workflows[data.id] = data;
        this.saveToStorage();
        this.loadWorkflow(data.id);
        toast('Imported workflow', 'success');
      } catch (err) {
        toast('Import failed: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  },

  renderWorkflowList() {
    const wfs = Object.values(State.workflows).sort((a,b) => b.updatedAt - a.updatedAt);
    const el = document.getElementById('wfList');
    if (!wfs.length) {
      el.innerHTML = `<div style="color:var(--text-3); font-size:11px; padding: 6px 4px;">No saved workflows</div>`;
      return;
    }
    el.innerHTML = wfs.map(w => `
      <div class="wf-item ${w.id === State.currentWfId ? 'active' : ''}" onclick="App.loadWorkflow('${w.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>
        <div class="wf-item-name">${w.name}</div>
        <button class="wf-item-del" onclick="event.stopPropagation(); App.deleteWorkflowById('${w.id}')" title="Delete">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    `).join('');
  },

  deleteWorkflowById(id) {
    const wf = State.workflows[id];
    if (!wf) return;
    if (!confirm(`Delete "${wf.name}"?`)) return;
    delete State.workflows[id];
    if (State.currentWfId === id) {
      const remaining = Object.values(State.workflows);
      if (remaining.length) this.loadWorkflow(remaining[0].id);
      else this.newWorkflow(true);
    }
    this.saveToStorage();
    this.renderWorkflowList();
    toast('Workflow deleted', 'info');
  },

  // ---------- STORAGE ----------
  async saveToStorage() {
    // Snapshot current workflow
    if (State.currentWfId) {
      const wf = State.workflows[State.currentWfId];
      if (wf) {
        wf.name = document.getElementById('wfTitleInput').value || wf.name;
        wf.nodes = [...State.nodes.values()];
        wf.edges = [...State.edges.values()];
      }
    }
    try {
      if (window.storage) {
        await window.storage.set('flow-studio:workflows', JSON.stringify(State.workflows));
        await window.storage.set('flow-studio:currentId', State.currentWfId || '');
      } else {
        // Fallback to in-memory only
        window._flowStorage = clone(State.workflows);
      }
    } catch (err) {
      console.warn('Storage save failed:', err);
    }
  },

  async loadWorkflowsFromStorage() {
    try {
      if (window.storage) {
        const r = await window.storage.get('flow-studio:workflows');
        if (r && r.value) State.workflows = JSON.parse(r.value);
        const c = await window.storage.get('flow-studio:currentId');
        if (c && c.value && State.workflows[c.value]) {
          this.loadWorkflow(c.value);
        } else {
          const first = Object.values(State.workflows)[0];
          if (first) this.loadWorkflow(first.id);
        }
      } else if (window._flowStorage) {
        State.workflows = clone(window._flowStorage);
        const first = Object.values(State.workflows)[0];
        if (first) this.loadWorkflow(first.id);
      }
    } catch (err) {
      // Usually the key simply doesn't exist yet — that's fine
    }
  },

  // ---------- SEARCH ----------
  filterPalette(q) {
    q = q.toLowerCase().trim();
    document.querySelectorAll('.palette-item').forEach(item => {
      const name = item.querySelector('.palette-item-name').textContent.toLowerCase();
      const desc = item.querySelector('.palette-item-desc').textContent.toLowerCase();
      const match = !q || name.includes(q) || desc.includes(q);
      item.style.display = match ? '' : 'none';
    });
    document.querySelectorAll('.palette-section').forEach(sec => {
      const visible = [...sec.querySelectorAll('.palette-item')].some(i => i.style.display !== 'none');
      sec.style.display = visible ? '' : 'none';
    });
  },

  // ---------- LOGS ----------
  log(level, nodeId, msg) {
    const entry = {
      t: new Date().toLocaleTimeString('en-US', { hour12: false }),
      level, nodeId, msg
    };
    State.logs.push(entry);
    if (State.logs.length > 500) State.logs.shift();
    this.renderLogs();
  },

  clearLogs() {
    State.logs = [];
    this.renderLogs();
  },

  renderLogs() {
    const body = document.getElementById('logsBody');
    const count = document.getElementById('logCount');
    count.textContent = State.logs.length;
    if (!State.logs.length) {
      body.innerHTML = `<div class="log-empty">No execution logs yet. Hit Run to start.</div>`;
      return;
    }
    body.innerHTML = State.logs.slice().reverse().map(e => {
      const nodeName = e.nodeId ? (State.nodes.get(e.nodeId)?.name || e.nodeId) : 'system';
      return `<div class="log-line">
        <span class="log-time">${e.t}</span>
        <span class="log-level ${e.level}">${e.level}</span>
        <span class="log-node">[${nodeName}]</span>
        <span class="log-msg">${e.msg}</span>
      </div>`;
    }).join('');
  },

  // ---------- SHORTCUTS ----------
  bindShortcuts() {
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); this.saveWorkflow(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); this.newWorkflow(); }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (State.selection.kind === 'node') this.deleteNode(State.selection.id);
        if (State.selection.kind === 'edge') this.deleteEdge(State.selection.id);
      }
      if (e.key === 'Escape') this.select(null);
      if (e.key === '=' || e.key === '+') Canvas.zoom(1.15);
      if (e.key === '-') Canvas.zoom(0.87);
      if (e.key === '0') Canvas.reset();
      if (e.key === 'f') Canvas.fitToView();
    });
  },

  bindTitleInput() {
    document.getElementById('wfTitleInput').addEventListener('input', () => this.markDirty());
  },

  bindFileInput() {
    document.getElementById('fileInput').addEventListener('change', (e) => {
      if (e.target.files[0]) this.handleImport(e.target.files[0]);
      e.target.value = '';
    });
  },

  // ---------- MODAL ----------
  showModal({ title, body, confirmLabel='Confirm', danger=false, onConfirm }) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${title}</h3>
        <p>${body}</p>
        <div class="modal-actions">
          <button class="modal-btn-secondary" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
          <button class="${danger ? 'modal-btn-danger' : 'modal-btn-primary'}" id="modalConfirm">${confirmLabel}</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.querySelector('#modalConfirm').onclick = () => { backdrop.remove(); onConfirm(); };
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  },
};

// -------------------- EXECUTION ENGINE --------------------
const Exec = {
  state: 'idle',     // idle | running | paused | success | failed | cancelled
  queue: [],         // BFS frontier of node IDs
  executing: new Set(),  // currently running node IDs (for parallel)
  completed: new Set(),
  failed: new Set(),
  lastFailed: null,
  timers: [],
  paused: false,

  setStatus(status) {
    this.state = status;
    const ind = document.getElementById('execIndicator');
    ind.className = 'exec-indicator ' + status;
    document.getElementById('execStatus').textContent = status.toUpperCase();
    // Buttons
    document.getElementById('btnRun').disabled = status === 'running' || status === 'paused';
    document.getElementById('btnPause').disabled = status !== 'running';
    document.getElementById('btnResume').disabled = !(status === 'paused' || status === 'failed' || status === 'cancelled');
    document.getElementById('btnRerun').disabled = !(status === 'success' || status === 'failed' || status === 'cancelled');
    document.getElementById('btnCancel').disabled = !(status === 'running' || status === 'paused');
  },

  reset() {
    this.queue = [];
    this.executing.clear();
    this.completed.clear();
    this.failed.clear();
    this.lastFailed = null;
    this.paused = false;
    this.clearTimers();
    // Clear node statuses and edge active flags
    State.nodes.forEach(n => { n.status = ''; });
    State.edges.forEach(e => { e._active = false; });
    Nodes.render();
    Edges.render();
  },

  clearTimers() {
    this.timers.forEach(t => clearTimeout(t));
    this.timers = [];
  },

  run() {
    this.reset();
    App.clearLogs();
    App.log('info', null, '▶ Workflow execution started');

    // Find all start nodes
    const starts = [...State.nodes.values()].filter(n => n.type === 'start' || n.type === 'trigger');
    if (!starts.length) {
      App.log('error', null, 'No start node found. Add a Start or Trigger node.');
      toast('Add a start node first', 'error');
      this.setStatus('failed');
      return;
    }
    this.setStatus('running');
    starts.forEach(n => this.executeNode(n.id));
  },

  cancel() {
    App.log('warn', null, '■ Workflow cancelled');
    this.clearTimers();
    // Mark all running as cancelled
    this.executing.forEach(id => {
      const node = State.nodes.get(id);
      if (node) node.status = 'cancelled';
    });
    this.executing.clear();
    State.nodes.forEach(n => {
      if (n.status === 'running') n.status = 'cancelled';
    });
    Nodes.render();
    this.setStatus('cancelled');
    this.lastFailed = [...State.nodes.values()].filter(n => n.status === 'cancelled').map(n => n.id);
  },

  pause() {
    if (this.state !== 'running') return;
    this.paused = true;
    App.log('warn', null, '⏸ Workflow paused');
    this.setStatus('paused');
    // Mark running nodes as paused visually (but keep them in executing so we can resume)
    this.executing.forEach(id => {
      const node = State.nodes.get(id);
      if (node && node.status === 'running') node.status = 'paused';
    });
    Nodes.render();
  },

  resume() {
    if (this.state === 'paused') {
      this.paused = false;
      App.log('info', null, '▶ Workflow resumed');
      this.setStatus('running');
      // Restart paused nodes' simulated work
      const toResume = [...this.executing];
      this.executing.clear();
      toResume.forEach(id => {
        const node = State.nodes.get(id);
        if (node) node.status = '';
        this.executeNode(id);
      });
    } else if (this.state === 'failed' || this.state === 'cancelled') {
      // Resume from failed/cancelled nodes
      App.log('info', null, '▶ Resuming from failure point');
      const failedIds = this.lastFailed || [...this.failed];
      if (!failedIds.length) { toast('Nothing to resume', 'error'); return; }
      // Reset the failed nodes and try again
      failedIds.forEach(id => {
        const node = State.nodes.get(id);
        if (node) node.status = '';
        this.failed.delete(id);
      });
      this.paused = false;
      this.setStatus('running');
      failedIds.forEach(id => this.executeNode(id));
    }
  },

  rerun() {
    App.log('info', null, '↻ Rerunning workflow from start');
    this.run();
  },

  executeNode(nodeId) {
    const node = State.nodes.get(nodeId);
    if (!node) return;
    if (this.paused) { this.executing.add(nodeId); return; }
    if (this.completed.has(nodeId) && node.type !== 'loop') return;
    if (this.executing.has(nodeId)) return;

    this.executing.add(nodeId);
    node.status = 'running';
    Nodes.render();
    App.log('info', nodeId, `Executing ${NodeTypes[node.type].label}`);

    // Simulate execution time
    const duration = this.simulatedDuration(node);
    const timer = setTimeout(() => {
      if (this.paused) return;
      if (this.state === 'cancelled') return;

      // Simulated random failure (1% chance) unless node is end
      const shouldFail = node._forceFail || (Math.random() < 0.02 && node.type !== 'start' && node.type !== 'end');

      if (shouldFail) {
        this.onNodeFail(node);
      } else {
        this.onNodeSuccess(node);
      }
    }, duration);
    this.timers.push(timer);
  },

  simulatedDuration(node) {
    if (node.type === 'start' || node.type === 'trigger') return 200;
    if (node.type === 'delay') {
      const c = node.config || {};
      let ms = parseInt(c.duration) || 1000;
      if (c.unit === 's') ms *= 1000;
      if (c.unit === 'm') ms *= 60000;
      return Math.min(ms, 2000); // cap at 2s for simulation
    }
    if (node.type === 'ai') return 800 + Math.random() * 1200;
    if (node.type === 'http') return 500 + Math.random() * 700;
    if (node.type === 'loop') return 500;
    return 400 + Math.random() * 400;
  },

  onNodeSuccess(node) {
    node.status = 'success';
    this.executing.delete(node.id);
    this.completed.add(node.id);
    App.log('success', node.id, '✓ Completed');
    Nodes.render();

    const type = NodeTypes[node.type];

    // Determine next edges to follow
    let edges = [];
    if (type.branches && node.branches) {
      // Decide which branch(es) to take
      if (node.type === 'if') {
        // Simulate true/false — take 'true' for demo
        const branch = Math.random() > 0.5 ? 'true' : 'false';
        edges = Edges.getSuccessors(node.id, 'branch', branch);
        App.log('info', node.id, `Condition evaluated: ${branch}`);
      } else if (node.type === 'switch') {
        const branch = node.branches[Math.floor(Math.random() * node.branches.length)];
        edges = Edges.getSuccessors(node.id, 'branch', branch);
        App.log('info', node.id, `Matched case: ${branch}`);
      } else if (node.type === 'parallel') {
        // Fan out to all branches
        node.branches.forEach(b => {
          edges.push(...Edges.getSuccessors(node.id, 'branch', b));
        });
        App.log('info', node.id, `Fan-out: ${node.branches.length} branches`);
      } else if (node.type === 'loop') {
        // Simulate iteration: go to 'iterate' a few times, then 'complete'
        const iterCount = (node._iterCount || 0) + 1;
        node._iterCount = iterCount;
        if (iterCount <= 3) {
          edges = Edges.getSuccessors(node.id, 'branch', 'iterate');
          App.log('info', node.id, `Iteration ${iterCount}`);
          // Reset completed state for loop body so we can re-execute
          edges.forEach(e => {
            this.completed.delete(e.target);
            const targetNode = State.nodes.get(e.target);
            if (targetNode) targetNode.status = '';
          });
          Nodes.render();
        } else {
          edges = Edges.getSuccessors(node.id, 'branch', 'complete');
          node._iterCount = 0;
          App.log('info', node.id, 'Loop complete');
        }
      }
    } else {
      edges = Edges.getSuccessors(node.id, 'out');
    }

    // Animate edges then fire next nodes
    edges.forEach(e => {
      e._active = true;
    });
    Edges.render();

    setTimeout(() => {
      edges.forEach(e => { e._active = false; });
      Edges.render();
      edges.forEach(e => this.executeNode(e.target));
      this.checkCompletion();
    }, 400);
  },

  onNodeFail(node) {
    node.status = 'failed';
    this.executing.delete(node.id);
    this.failed.add(node.id);
    App.log('error', node.id, '✗ Failed — ' + this.randomError());
    Nodes.render();

    // Follow error edges if any
    const errEdges = Edges.getSuccessors(node.id, 'error');
    if (errEdges.length) {
      App.log('info', node.id, `Routing to error handler (${errEdges.length} edge${errEdges.length > 1 ? 's' : ''})`);
      errEdges.forEach(e => { e._active = true; });
      Edges.render();
      setTimeout(() => {
        errEdges.forEach(e => { e._active = false; });
        Edges.render();
        errEdges.forEach(e => this.executeNode(e.target));
        this.checkCompletion();
      }, 400);
    } else {
      this.lastFailed = [node.id];
      this.setStatus('failed');
      App.log('error', null, '✗ Workflow failed');
    }
  },

  randomError() {
    const errors = ['Connection timeout', 'Validation failed', 'Upstream 500', 'Rate limited', 'Malformed response'];
    return errors[Math.floor(Math.random() * errors.length)];
  },

  checkCompletion() {
    if (this.state !== 'running') return;
    if (this.executing.size === 0) {
      if (this.failed.size > 0) {
        this.lastFailed = [...this.failed];
        this.setStatus('failed');
        App.log('error', null, `✗ Workflow failed (${this.failed.size} failed node${this.failed.size > 1 ? 's' : ''})`);
      } else {
        this.setStatus('success');
        App.log('success', null, '✓ Workflow completed successfully');
      }
    }
  }
};

window.App = App;
window.Exec = Exec;
window.Canvas = Canvas;
window.Nodes = Nodes;
window.Edges = Edges;

document.addEventListener('DOMContentLoaded', () => {
  App.init();
  Exec.setStatus('idle');
  // Seed a demo workflow if nothing was loaded
  setTimeout(() => {
    if (State.nodes.size <= 1) seedDemo();
  }, 200);
});

// -------------------- DEMO SEED --------------------
function seedDemo() {
  State.nodes.clear();
  State.edges.clear();

  // Layout: Start → HTTP → If → (true: AI, false: Log) → End
  const addNode = (type, x, y, overrides={}) => {
    const t = NodeTypes[type];
    const n = {
      id: uid('n'), type, name: t.label,
      x, y, width: 220,
      config: clone(t.config || {}),
      status: '', ...overrides
    };
    if (t.branches) n.branches = [...t.branches];
    State.nodes.set(n.id, n);
    return n;
  };

  const start = addNode('start', 200, 100, { name: 'Manual Trigger' });
  const http = addNode('http', 200, 280, {
    name: 'Fetch User Data',
    config: { method: 'GET', url: 'https://api.example.com/user/42', headers: '{}' }
  });
  const ifNode = addNode('if', 200, 480, {
    name: 'Is premium?',
    config: { condition: 'input.user.tier === "premium"' }
  });
  const ai = addNode('ai', -40, 720, {
    name: 'Generate Welcome',
    config: {
      mode: 'skill', skillId: 'generate_welcome',
      model: 'claude-opus-4-7',
      systemPrompt: 'You are a concise welcome message generator.',
      inputMapping: 'input.user', outputKey: 'message',
      temperature: 0.7, maxTokens: 500
    }
  });
  const log = addNode('log', 440, 720, {
    name: 'Log free-tier',
    config: { level: 'info', message: 'Free-tier user visited' }
  });
  const loop = addNode('loop', -40, 920, {
    name: 'For each message',
    config: { source: 'input.notifications', mode: 'foreach', maxIterations: 50 }
  });
  const send = addNode('action', -260, 1120, {
    name: 'Send Notification',
    config: { actionType: 'function', handler: 'send_notif' }
  });
  const end = addNode('end', 200, 1320, { name: 'Done' });

  State.nodes.set(start.id, start);
  State.nodes.set(http.id, http);
  State.nodes.set(ifNode.id, ifNode);
  State.nodes.set(ai.id, ai);
  State.nodes.set(log.id, log);
  State.nodes.set(loop.id, loop);
  State.nodes.set(send.id, send);
  State.nodes.set(end.id, end);

  const addEdge = (source, sourcePort, target, sourcePortName=undefined) => {
    const id = uid('e');
    State.edges.set(id, { id, source, sourcePort, sourcePortName, target, targetPort: 'in' });
  };

  addEdge(start.id, 'out', http.id);
  addEdge(http.id, 'out', ifNode.id);
  addEdge(ifNode.id, 'branch', ai.id, 'true');
  addEdge(ifNode.id, 'branch', log.id, 'false');
  addEdge(ai.id, 'out', loop.id);
  addEdge(loop.id, 'branch', send.id, 'iterate');
  addEdge(loop.id, 'branch', end.id, 'complete');
  addEdge(log.id, 'out', end.id);
  addEdge(send.id, 'out', loop.id);

  State.isDirty = false;
  const wf = State.workflows[State.currentWfId];
  if (wf) wf.name = 'Demo: User Onboarding';
  document.getElementById('wfTitleInput').value = 'Demo: User Onboarding';
  App.renderAll();
  setTimeout(() => Canvas.fitToView(), 100);
  App.log('info', null, 'Demo workflow loaded');
}

</script>
